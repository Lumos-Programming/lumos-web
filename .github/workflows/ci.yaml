name: CI

on:
  pull_request:
    # ラベル不要。PR作成・更新・再オープン時などに実行する。
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install aqua
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with: 
          aqua_version: v2.63.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'
        
      - name: CLI Install
        run: aqua i -l

      - name: Run test
        run: just test