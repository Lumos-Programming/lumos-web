name: AI PR Review
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited
permissions: {}
env:
  GEMINI_MODEL: gemini-3.8-flash
  REVIEW_LANGUAGE: 日本語
  SANDBOX_NETWORK: public
# ai-review-actionsは開発段階のため、3つのActionでmainを参照する。
jobs:
  prepare:
    name: PRの議論と前回のレビュー状態を取得
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # 同一リポジトリ内のPRが対象。Draftも調査する。
    # forkとDependabotは、Secrets・トークン権限の制約から対象外。
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && github.actor != 'dependabot[bot]'
    # 投稿用と同じAppを識別し、読み取り専用トークンで議論を取得する。
    permissions: {}
    outputs:
      context: ${{ steps.context.outputs.context }}
      review-base-sha: ${{ steps.context.outputs.review-base-sha }}
      head-sha: ${{ steps.context.outputs.head-sha }}
      base-sha: ${{ steps.context.outputs.base-sha }}
      skip-review: ${{ steps.context.outputs.skip-review }}
    steps:
      - name: GitHub Appの登録を確認
        env:
          APP_CLIENT_ID: ${{ vars.AI_REVIEW_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$APP_CLIENT_ID" ]]; then
            echo "::error::Actions Variable に AI_REVIEW_APP_CLIENT_ID を登録してください。"
            exit 1
          fi
          if [[ -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Actions Secret に AI_REVIEW_APP_PRIVATE_KEY を登録してください。"
            exit 1
          fi
      - name: このリポジトリのPR読み取り用トークンを発行
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AI_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: read
      - name: PRの議論と差分レビューの基点を取得
        id: context
        uses: Lumos-Programming/ai-review-actions/context@main
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          reviewer-login: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          pull-request-number: ${{ github.event.pull_request.number }}
          # モデル・言語・通信設定は調査と共有し、方針や上限の変更時も更新する。
          review-profile: ${{ format('model={0};language={1};network={2};budgets=default;mcp=none;policy=1', env.GEMINI_MODEL, env.REVIEW_LANGUAGE, env.SANDBOX_NETWORK) }}
  analyze:
    name: コードを調査
    needs: prepare
    if: needs.prepare.outputs.skip-review != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ai-review-analyze-${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      report: ${{ steps.review.outputs.report }}
    steps:
      - name: APIキーの登録を確認
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "::error::Actions Secret に GEMINI_API_KEY を登録してください。"
            exit 1
          fi
      - name: PRのコードを取得
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false
          # Actionの実装とレビュー対象のcheckoutを分離する。
          path: source
      - name: 比較対象のコミットを確認
        working-directory: source
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base-sha }}
          HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git --no-pager diff --no-ext-diff --no-textconv \
            --stat "${BASE_SHA}...${HEAD_SHA}"
      # pnpm・actionlintを含む既定イメージを使用する。
      # 必要な依存関係はモデルが判断し、サンドボックス内で取得・検証する。
      # 必要な検証を代替手段でも完了できない場合はCOMMENTにする。
      # コマンドの成功件数ではなく、変更内容の評価と根拠で判定する。
      - name: Pydantic AIで調査してJSONを出力
        id: review
        uses: Lumos-Programming/ai-review-actions@main
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          model: ${{ env.GEMINI_MODEL }}
          review-language: ${{ env.REVIEW_LANGUAGE }}
          sandbox-network: ${{ env.SANDBOX_NETWORK }}
          repository: ${{ github.repository }}
          pull-request-number: ${{ github.event.pull_request.number }}
          base-sha: ${{ needs.prepare.outputs.base-sha }}
          head-sha: ${{ needs.prepare.outputs.head-sha }}
          review-base-sha: ${{ needs.prepare.outputs.review-base-sha }}
          review-context: ${{ needs.prepare.outputs.context }}
          source-directory: source
  publish:
    name: 判定して正式なレビューを投稿
    needs: [prepare, analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # 投稿処理を途中でキャンセルせず、同じPRへの投稿を直列化する。
    concurrency:
      group: ai-review-publish-${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # このジョブはPRをcheckoutせず、モデルAPIキーも受け取らない。
    # Geminiが生成したコードやコマンドは実行しない。
    # GITHUB_TOKENには投稿権限を付与せず、GitHub App名義で投稿する。
    permissions: {}
    steps:
      - name: GitHub Appの登録を確認
        env:
          APP_CLIENT_ID: ${{ vars.AI_REVIEW_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$APP_CLIENT_ID" ]]; then
            echo "::error::Actions Variable に AI_REVIEW_APP_CLIENT_ID を登録してください。"
            exit 1
          fi
          if [[ -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Actions Secret に AI_REVIEW_APP_PRIVATE_KEY を登録してください。"
            exit 1
          fi
      - name: このリポジトリのPR投稿用トークンを発行
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AI_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: JSONを検証してPR Reviewを投稿
        uses: Lumos-Programming/ai-review-actions/publish@main
        with:
          report: ${{ needs.analyze.outputs.report }}
          github-token: ${{ steps.app-token.outputs.token }}
          reviewer-login: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug) }}
          model: ${{ env.GEMINI_MODEL }}
          review-context: ${{ needs.prepare.outputs.context }}
          pull-request-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ needs.prepare.outputs.head-sha }}
          base-sha: ${{ needs.prepare.outputs.base-sha }}
