name: Validate release tag
on: create
jobs:
  validate-release-tag:
    if: github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: "write"
    steps:
      - name: Checkout validation code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate tag
        id: validate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.ref }}
        run: |
          stable_release_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          # Tag 作成イベントには Release の種別情報が無いため、タグ形式から種別を判定する。
          bash .github/scripts/validate-release-tag.sh auto "$RELEASE_TAG" <<< "$stable_release_tags"

      # API 取得などの予期しない失敗では削除せず、明示的な検証エラーの場合だけ削除する。
      - name: Delete invalid tag
        if: steps.validate.outputs.invalid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.ref }}
        run: |
          encoded_tag=$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$encoded_tag"

      - name: Fail workflow for invalid tag
        if: always() && steps.validate.outcome == 'failure'
        run: exit 1
