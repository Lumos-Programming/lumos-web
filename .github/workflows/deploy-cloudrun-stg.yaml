# Pre-release のタグを検証し、staging Environment を使用して Staging の Cloud Run へデプロイする。
name: Deploy to Cloud Run (Staging)
on:
  release:
    types:
      - published
jobs:
  validate-release-tag:
    # Draft からの公開も検証するため published を使い、Pre-release だけを処理する。
    if: github.event.release.prerelease == true
    runs-on: ubuntu-latest
    permissions:
      contents: "write"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate pre-release tag
        id: validate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          stable_release_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          bash .github/scripts/validate-release-tag.sh prerelease "$RELEASE_TAG" <<< "$stable_release_tags"

      # API 取得などの予期しない失敗では削除せず、明示的な検証エラーの場合だけ削除する。
      - name: Delete invalid pre-release and tag
        if: steps.validate.outputs.invalid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release delete "$RELEASE_TAG" --cleanup-tag --yes

      - name: Fail workflow for invalid pre-release tag
        if: always() && steps.validate.outcome == 'failure'
        run: exit 1

  build-and-deploy:
    needs: validate-release-tag
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: "projects/599050591800/locations/global/workloadIdentityPools/default/providers/provider-github"
          service_account: "gh-actions@lumos-infra.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: "google-github-actions/setup-gcloud@v2"
        with:
          version: ">= 363.0.0"

      - name: Authorize Docker
        id: docker-auth
        uses: docker/login-action@v3
        with:
          username: "oauth2accesstoken"
          password: ${{ steps.auth.outputs.access_token }}
          registry: asia-northeast1-docker.pkg.dev

      - name: Change robots.txt
        run: |
          echo "User-agent: *" > ./public/robots.txt
          echo "Disallow: /" >> ./public/robots.txt

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: asia-northeast1-docker.pkg.dev/lumos-infra/lumos-web/stg:latest
          context: .
          file: ./cloudrun/Dockerfile
          build-args: |
            NEXT_PUBLIC_APP_ENV=staging
            COMMIT_SHA=${{ github.sha }}

      - name: Download Cloud Run Service YAML
        run: |
          gcloud run services describe lumos-web-stg --format yaml --region asia-northeast1 > ./cloudrun/service-hp-stg.yaml

      # replace github_sha field to latest commit sha. Changing spec.template is required to deploy new revision.
      # reference: https://cloud.google.com/run/docs/deploying?hl=ja#revision -- check yaml tab.
      - name: Change some property of service-hp-stg.yaml
        run: |
          sed -i "s/github_sha: .*/github_sha: ${{ github.sha }}/g" ./cloudrun/service-hp-stg.yaml

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          region: "asia-northeast1"
          metadata: "./cloudrun/service-hp-stg.yaml"
